<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Angie Fortuño</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: #fff;
            line-height: 1.4;
        }

        .header-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .title-line {
            background: #fff;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            margin: -20px -20px 20px -20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
        }

        .title-section {
            flex: 1;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            color: #000;
            margin: 0;
            display: inline;
        }

        .superscript {
            font-size: 12px;
            vertical-align: super;
        }

        .pronunciation {
            font-size: 12px;
            color: #000;
            font-style: italic;
            display: block;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .nav-links a {
            color: #000;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #0000EE;
            text-decoration: underline;
        }

        .main-content {
            opacity: 0;
            animation: fadeIn 1s ease-in 0.3s forwards;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .project-card {
            text-decoration: none;
            color: #000;
            display: block;
            transition: transform 0.2s;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

.project-image {
    width: 100%;
    height: 200px;
    object-fit: contain;  
    border: 1px solid #ccc;
    margin-bottom: 10px;
    background-color: #f5f5f5;  
}

        .project-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .project-description {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        @media (max-width: 768px) {
            .nav-links {
                margin-top: 10px;
                gap: 15px;
            }

            h1 {
                font-size: 20px;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="title-line">
            <div class="title-section">
                <h1>seal rave<span class="superscript">1</span></h1>
                <span class="pronunciation">/sē(ə)l/ /rāv/</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">home</a>
                <a href="projects.html">projects</a>
                <a href="cv.html">CV</a>
                <a href="friends.html">friends</a>
            </nav>
        </div>
    </div>
    
    <div class="main-content">
        <h2>Projects</h2>
        <div class="projects-grid">
            <a href="projects/mbtatracker.html" class="project-card">
                <img src="projects/mbtatracker-cover.jpeg" alt="MBTA Tracker" class="project-image">
                <div class="project-title">MBTA Tracker</div>
            </a>
            <a href="projects/slingblade.html" class="project-card">
                <img src="projects/slingblade-cover.jpeg" alt="slingBlade">
                <div class="project-title">slingBlade</div>
            </a>
            
        </div>
    </div>
</body>
</html>
