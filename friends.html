<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends - Angie Fortuno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background-image: url('download.gif');
            background-size: cover;
            background-position: center;
            background-repeat: repeat;
            background-attachment: fixed;
            line-height: 1.4;
            min-height: 100vh;
        }

        .header-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .title-line {
            background: rgba(255, 255, 255, 0.50);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            margin: -20px -20px 20px -20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
        }

        .title-section {
            flex: 1;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            color: #000;
            margin: 0;
            display: inline;
        }

        .superscript {
            font-size: 12px;
            vertical-align: super;
        }

        .pronunciation {
            font-size: 12px;
            color: #000;
            font-style: italic;
            display: block;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .nav-links a {
            color: #000;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #0000EE;
            text-decoration: underline;
        }

        .main-content {
            opacity: 0;
            animation: fadeIn 1s ease-in 0.3s forwards;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .friends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .friend-card {
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .friend-card:hover {
            transform: translateY(-5px);
        }

        .friend-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .friend-name {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .nav-links {
                margin-top: 10px;
                gap: 15px;
            }

            h1 {
                font-size: 20px;
            }

            .friends-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 20px;
            }

            .friend-image {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
